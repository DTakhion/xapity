# cloudrun-dev.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: xapity-api-dev
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/container-dependencies: '{"xapity-api":["ollama"]}'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: 179536772092-compute@developer.gserviceaccount.com
      containers:
        - name: xapity-api
          image: us-central1-docker.pkg.dev/fiery-strategy-497320-n9/xapity/xapity-api:dev
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: QICORE_BASE_URL
              value: "https://qicore-api-841451822292.us-central1.run.app"
            - name: QICORE_API_KEY
              value: qk_live_wlhACg7ldRpPluTkUfYgNniXdvwtIdMG6DraxzVF1xg

            - name: MONGO_DB
              value: "xapity_dev"
            - name: SERVICES_COLLECTION
              value: "services"

            - name: MONGODB_DB
              value: "luca_db-dev"
            - name: LUCA_LOGIN_URL
              value: "https://gcp-dev-465219.web.app/auth/signin"
            - name: LUCA_USERNAME
              value: "daniel@tryluca.cl"
            - name: LUCA_PASSWORD
              value: Vamos1234
            - name: LUCA_API_BASE_URL
              value: "https://luca-api-dev-bvxil9xk.ue.gateway.dev"
            - name: LUCA_BUSINESS_ID
              value: "11"

            - name: JWT_ALGORITHM
              value: "HS256"
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "480"
            - name: USERS_COLLECTION
              value: "users"

            - name: OLLAMA_BASE_URL
              value: "http://localhost:11434"
            - name: OLLAMA_EMBEDDING_MODEL
              value: "nomic-embed-text"
            - name: OLLAMA_LLM_MODEL
              value: "llama3.2:3b"

            - name: MAF_BUSINESS_ID
              value: "maf"
            - name: MAF_ALLOWED_EMAIL_DOMAINS
              value: "mafchile.com,maf.cl,maf.com,takhion.com"

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: xapity-dev-mongo-uri
                  key: latest
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: xapity-dev-mongodb-uri
                  key: latest
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: xapity-dev-jwt-secret-key
                  key: latest

            - name: EMAIL_MODE
              value: "smtp"
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USERNAME
              value: "no-reply@xapity.app"
            - name: SMTP_FROM_EMAIL
              value: "no-reply@xapity.app"
            - name: SMTP_FROM_NAME
              value: "Xapity"
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xapity-dev-smtp-password
                  key: latest

            - name: REGISTRATION_CODE_EXPIRE_MINUTES
              value: "15"
            - name: REGISTRATION_MAX_ATTEMPTS
              value: "5"
            - name: PENDING_REGISTRATIONS_COLLECTION
              value: "pending_registrations"

            - name: PASSWORD_RESET_CODES_COLLECTION
              value: "password_reset_codes"
            - name: PASSWORD_RESET_CODE_EXPIRE_MINUTES
              value: "15"
            - name: PASSWORD_RESET_MAX_ATTEMPTS
              value: "5"

            - name: FRONTEND_BASE_URL
              value: "https://xapity-45d11.web.app"

          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 240
            timeoutSeconds: 240
            failureThreshold: 1

        - name: ollama
          image: us-central1-docker.pkg.dev/fiery-strategy-497320-n9/xapity/xapity-ollama:dev
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          startupProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30