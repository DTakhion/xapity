name: Deploy DEV to Cloud Run

on:
  push:
    branches:
      - dev

env:
  PROJECT_ID: fiery-strategy-497320-n9
  REGION: us-central1
  REPOSITORY: xapity
  SERVICE: xapity-api-dev
  IMAGE: xapity-api
  OLLAMA_IMAGE: xapity-ollama

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build API Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }} \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:dev \
            .

      - name: Push API Docker image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:dev

      - name: Build Ollama Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.ollama \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$OLLAMA_IMAGE:${{ github.sha }} \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$OLLAMA_IMAGE:dev \
            .

      - name: Push Ollama Docker image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$OLLAMA_IMAGE:${{ github.sha }}
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$OLLAMA_IMAGE:dev

      - name: Deploy to Cloud Run DEV
        run: |
          gcloud run deploy $SERVICE \
            --region $REGION \
            --platform managed \
            --no-invoker-iam-check \
            --timeout 300 \
            --container xapity-api \
            --image $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }} \
            --port 8080 \
            --cpu 1 \
            --memory 1Gi \
            --set-env-vars OLLAMA_BASE_URL=http://localhost:11434,OLLAMA_EMBEDDING_MODEL=nomic-embed-text,OLLAMA_LLM_MODEL=llama3.2:3b \
            --container ollama \
            --image $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$OLLAMA_IMAGE:${{ github.sha }} \
            --cpu 2 \
            --memory 4Gi \
            --set-env-vars OLLAMA_HOST=0.0.0.0:11434