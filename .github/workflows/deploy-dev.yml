name: Deploy DEV to Cloud Run

on:
  push:
    branches:
      - dev

env:
  PROJECT_ID: fiery-strategy-497320-n9
  REGION: us-central1
  REPOSITORY: xapity
  SERVICE: xapity-api-dev
  IMAGE: xapity-api
  OLLAMA_IMAGE: xapity-ollama

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build API Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }} \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:dev \
            .

      - name: Push API Docker image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:dev

      - name: Build Ollama Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.ollama \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$OLLAMA_IMAGE:${{ github.sha }} \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$OLLAMA_IMAGE:dev \
            .

      - name: Push Ollama Docker image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$OLLAMA_IMAGE:${{ github.sha }}
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$OLLAMA_IMAGE:dev

      - name: Render Cloud Run manifest
        run: |
          sed -i "s|us-central1-docker.pkg.dev/fiery-strategy-497320-n9/xapity/xapity-api:dev|$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}|g" cloudrun-dev.yaml
          sed -i "s|us-central1-docker.pkg.dev/fiery-strategy-497320-n9/xapity/xapity-ollama:dev|$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$OLLAMA_IMAGE:${{ github.sha }}|g" cloudrun-dev.yaml

      - name: Deploy to Cloud Run DEV
        run: |
          gcloud run services replace cloudrun-dev.yaml \
            --region $REGION